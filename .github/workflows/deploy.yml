name: Build and Deploy Monorepo

on:
  push:
    branches: [dev, testing, staging, prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: ${{ github.ref_name }} 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: lc
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # --- BUILD ALL 3 IMAGES ---
      - name: Build Frontend
        run: docker build -t ghcr.io/${{ steps.lc.outputs.owner }}/tender-frontend:${{ github.ref_name }} ./frontend

      - name: Build Agent
        run: docker build -t ghcr.io/${{ steps.lc.outputs.owner }}/tender-agent:${{ github.ref_name }} ./agent

      - name: Build Scraper/DB
        run: docker build -t ghcr.io/${{ steps.lc.outputs.owner }}/tender-scraper:${{ github.ref_name }} ./scraper-db

      # --- PUSH ALL 3 IMAGES ---
      - name: Push Images
        run: |
          docker push ghcr.io/${{ steps.lc.outputs.owner }}/tender-frontend:${{ github.ref_name }}
          docker push ghcr.io/${{ steps.lc.outputs.owner }}/tender-agent:${{ github.ref_name }}
          docker push ghcr.io/${{ steps.lc.outputs.owner }}/tender-scraper:${{ github.ref_name }}

      - name: Deploy to Server
        env:
          OWNER: ${{ steps.lc.outputs.owner }}
          BRANCH: ${{ github.ref_name }}
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          cd ${{ github.workspace }}
          
          PROJECT_NAME="tender-${{ github.ref_name }}"
          export GITHUB_OWNER="${OWNER}"
          export IMAGE_TAG="${BRANCH}"

          # Set Ports based on branch
          if [ "$BRANCH" = "prod" ]; then
            export FRONTEND_PORT=9001; export AGENT_PORT=9000; export SCRAPER_PORT=8000
          elif [ "$BRANCH" = "staging" ]; then
            export FRONTEND_PORT=9011; export AGENT_PORT=9012; export SCRAPER_PORT=9013
          elif [ "$BRANCH" = "testing" ]; then
            export FRONTEND_PORT=9021; export AGENT_PORT=9022; export SCRAPER_PORT=9023
          else
            export FRONTEND_PORT=9031; export AGENT_PORT=9032; export SCRAPER_PORT=9033
          fi

          docker compose -p $PROJECT_NAME up -d --force-recreate
          docker compose -p $PROJECT_NAME ps