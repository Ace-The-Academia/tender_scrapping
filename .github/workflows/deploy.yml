name: Build and Deploy

on:
  push:
    branches:
      - dev
      - testing
      - staging
      - prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy - ${{ github.ref_name }}
    runs-on: self-hosted
    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: lc
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          OWNER: ${{ steps.lc.outputs.owner }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER}/tender-scrapping"
          echo "Building image for ${BRANCH}"
          docker build \
            -t "${IMAGE}:${BRANCH}" \
            -t "${IMAGE}:${SHA}" \
            .

      - name: Push Docker image
        env:
          OWNER: ${{ steps.lc.outputs.owner }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER}/tender-scrapping"
          echo "Pushing ${IMAGE}:${BRANCH}"
          docker push "${IMAGE}:${BRANCH}"
          echo "Pushing ${IMAGE}:${SHA}"
          docker push "${IMAGE}:${SHA}"

      - name: Deploy to Server
        env:
          OWNER: ${{ steps.lc.outputs.owner }}
          BRANCH: ${{ github.ref_name }}
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          
          PROJECT_NAME="tender-${BRANCH}"
          export IMAGE="ghcr.io/${OWNER}/tender-scrapping"
          export IMAGE_TAG="${BRANCH}"

          case "$BRANCH" in
            prod)    export HOST_PORT="9000" ;;
            staging) export HOST_PORT="9011" ;;
            testing) export HOST_PORT="9012" ;;
            dev)     export HOST_PORT="9013" ;;
            *)       echo "ERROR: Unsupported branch ${BRANCH}"; exit 1 ;;
          esac

          echo "================================"
          echo "Deploying: ${IMAGE}:${IMAGE_TAG} on port ${HOST_PORT}"
          echo "================================"

          # Validate configuration and deploy
          docker compose -p "${PROJECT_NAME}" config --quiet
          docker compose -p "${PROJECT_NAME}" up -d --force-recreate --remove-orphans
          docker compose -p "${PROJECT_NAME}" ps
          
          echo "Deployment completed for ${BRANCH}"